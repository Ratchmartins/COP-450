apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-asanti # Naming this after your user 'asanti' for consistency
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:15
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: myapp_db
      owner: asanti # Matches your new system user
