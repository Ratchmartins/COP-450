name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  # 1. Security & Quality Job (Pytest & Bandit)
  security-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install -r requirements.txt pytest bandit
      - name: Run Unit Tests
        run: pytest
      - name: Run Code Scan (Bandit)
        run: bandit -r app/

  # 2. Build and Scan Job (Docker & Trivy)
  build-and-scan:
    needs: security-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Image Name (Lowercase)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/secure-app:latest" >> $GITHUB_ENV
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ env.IMAGE_NAME }}
      - name: Run Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # 3. Deploy Job (Orchestration)
  deploy-production:
    needs: build-and-scan
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Deploy to Local Kubernetes
        run: |
          export KUBECONFIG=$HOME/.kube/config

          # CLEANUP: Remove old standalone DB to free up RAM for pg-asanti
          kubectl delete deployment db-deployment --ignore-not-found=true

          # 1. Apply Master-Slave Cluster
          kubectl apply -f k8s/db-cluster.yaml

          # 2. Robust Wait Logic
          echo "Waiting for pg-asanti cluster to be Ready..."
          # Increased timeout to 600s because VirtualBox can be slow
          kubectl wait --for=jsonpath='{.status.phase}'=Ready cluster/pg-asanti --timeout=600s

          # 3. Apply Networking & Application
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment2.yaml
          kubectl apply -f k8s/ingress.yaml

          # 4. Monitor Rollout
          echo "Monitoring application rollout..."
          kubectl rollout status deployment/secure-app --timeout=600s

          # 5. Final restart to ensure clean environment
          kubectl rollout restart deployment secure-app
