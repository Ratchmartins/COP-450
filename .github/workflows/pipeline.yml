name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:

  # -----------------------------------
  # 1. SECURITY & TESTING (SAST + Unit Tests)
  # -----------------------------------
  security-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt pytest bandit

      - name: Run Unit Tests
        run: pytest

      - name: Run Code Scan (Bandit)
        run: bandit -r app/ -s B104


  # -----------------------------------
  # 2. BUILD & CONTAINER SCAN
  # -----------------------------------
  build-and-scan:
    needs: security-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Name (Lowercase)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/secure-app:latest" >> $GITHUB_ENV

      - name: Build and Push Image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Run Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'


  # -----------------------------------
  # 3. DEPLOYMENT (CLEAN + RELIABLE CNPG FLOW)
  # -----------------------------------
  deploy-production:
    needs: build-and-scan
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Kubernetes
        run: |
          export KUBECONFIG=$HOME/.kube/config

          echo "🧹 Removing legacy standalone DB (if any)..."
          kubectl delete deployment db-deployment --ignore-not-found=true

          echo "🚀 Applying CNPG PostgreSQL Cluster..."
          kubectl apply -f k8s/db-cluster.yaml

          echo "⏳ Waiting for PostgreSQL pods to be READY..."
          kubectl wait --for=condition=ready pod \
            -l cnpg.io/cluster=pg-asanti \
            --timeout=300s

          echo "🔎 Verifying DB service endpoints (pg-asanti-rw)..."
          until kubectl get endpoints pg-asanti-rw | grep -q ":"; do
            echo "Waiting for DB endpoints..."
            sleep 5
          done

          echo "🚀 Deploying application resources..."
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment2.yaml
          kubectl apply -f k8s/ingress.yaml

          echo "⏳ Waiting for application rollout..."
          kubectl rollout status deployment secure-app --timeout=300s

          echo "✅ Deployment successful!"
