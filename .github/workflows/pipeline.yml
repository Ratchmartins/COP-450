name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  # 1. Security & Quality Job
  security-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt pytest bandit

      - name: Run Unit Tests (Pytest)
        # Ensures functional correctness before security scans
        run: pytest

      - name: Run Code Scan (Bandit)
        # SAST: Checks for hardcoded passwords and insecure function calls
        run: bandit -r app/

      - name: Run Container Scan (Trivy)
        # SCA: Scans the OS and libraries for known vulnerabilities (CVEs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/secure-app:latest'
          format: 'table'
          exit-code: '1' # Fails the build if "CRITICAL" vulnerabilities are found
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # 2. Build and Deploy Job
  deploy-production:
    needs: security-and-test
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/secure-app:latest" >> $GITHUB_ENV

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Deploy to Local Kubernetes
        run: |
          export KUBECONFIG=$HOME/.kube/config
          
          # 1. Apply Master-Slave DB
          kubectl apply -f k8s/db-cluster.yaml
          
          # 2. Wait for DB readiness to avoid app connection errors
          echo "Waiting for pg-asanti to reach Ready state..."
          sleep 30
          kubectl wait --for=jsonpath='{.status.phase}'=Ready cluster/pg-asanti --timeout=300s
          
          # 3. Apply App configurations
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment2.yaml
          kubectl apply -f k8s/ingress.yaml
          
          # 4. Monitor rollout for stability
          kubectl rollout status deployment/secure-app --timeout=600s
          
          # 5. Final refresh
          kubectl rollout restart deployment secure-app
