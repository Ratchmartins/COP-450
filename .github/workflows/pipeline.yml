name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  # 1. SECURITY & QUALITY: Bandit for SAST and Pytest for logic
  security-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install -r requirements.txt pytest bandit
      - name: Run Unit Tests (Pytest)
        run: pytest
      - name: Run Code Scan (Bandit)
        run: bandit -r app/

  # 2. BUILD AND SCAN: Build container and run Trivy SCA
  build-and-scan:
    needs: security-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Image Name (Lowercase)
        # Prevents parsing errors seen in earlier runs
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/secure-app:latest" >> $GITHUB_ENV
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ env.IMAGE_NAME }}
      - name: Run Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # 3. DEPLOY: Orchestrate the Master-Slave Cluster transition
  deploy-production:
    needs: build-and-scan
    runs-on: self-hosted # Targeting Martine's local runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Deploy to Local Kubernetes
        run: |
          export KUBECONFIG=$HOME/.kube/config

          # PRE-DEPLOY CLEANUP: Resolve 'Split-Brain' DB issue from image_f20320.jpg
          echo "Removing conflicting standalone DB..."
          kubectl delete deployment db-deployment --ignore-not-found=true

          # 1. Apply CloudNativePG Cluster
          kubectl apply -f k8s/db-cluster.yaml

          # 2. UPDATED WAIT LOGIC: Match 'Healthy' status from image_e80b14.png
          echo "Waiting for pg-asanti cluster to be Healthy..."
          # Increased timeout to 600s to handle VirtualBox resource spikes
          kubectl wait --for=jsonpath='{.status.phase}'=Healthy cluster/pg-asanti --timeout=600s

          # 3. Apply App configurations (5 replicas for COP 450 labs)
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment2.yaml
          kubectl apply -f k8s/ingress.yaml

          # 4. FORCE RESTART: Clear the CrashLoopBackOff seen in image_e7a0dc.png
          echo "Restarting application pods to refresh database connection..."
          kubectl rollout restart deployment secure-app
          
          # 5. Monitor Rollout
          kubectl rollout status deployment/secure-app --timeout=180s
