name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  # 1. Test and Security Job
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install -r requirements.txt pytest bandit
      - name: Run Unit Tests
        run: pytest
      - name: Run Security Scan (Bandit)
        run: bandit -r app/

  # 2. Build and Deploy Job
  deploy-production:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Name
        run: |
          # Converts repository name to lowercase for GHCR compatibility
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/secure-app:latest" >> $GITHUB_ENV

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Deploy to Local Kubernetes
        run: |
          # Use the standard kubeconfig path for the self-hosted runner
          export KUBECONFIG=$HOME/.kube/config
          
          # 1. Start the Master-Slave Database Cluster
          # Using CloudNativePG operator to manage the pg-asanti instances
          kubectl apply -f k8s/db-cluster.yaml
          
          # 2. Wait for Database to be Ready
          # This prevents the app from failing its Readiness Probe during rollout
          echo "Waiting for PostgreSQL cluster (pg-asanti) to reach Ready state..."
          sleep 30 # Initial buffer for API registration
          kubectl wait --for=jsonpath='{.status.phase}'=Ready cluster/pg-asanti --timeout=300s[cite: 1]
          
          # 3. Apply Networking and Application
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment2.yaml
          kubectl apply -f k8s/ingress.yaml
          
          # 4. Monitor Application Rollout
          # Increased timeout to 600s to account for VirtualBox resource constraints
          echo "Monitoring application rollout for 'secure-app'..."
          kubectl rollout status deployment/secure-app --timeout=600s
          
          # 5. Final Refresh
          # Ensures the latest image and configuration are fully operational
          kubectl rollout restart deployment secure-app
